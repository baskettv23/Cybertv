name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Permitir enlaces http en el APK
        run: grep -q usesCleartextTraffic android/app/src/main/AndroidManifest.xml || sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
      - name: Instalar plugin de reproductor externo
        run: |
          mkdir -p android/app/src/main/java/com/m3u/colorida
          cp android-src/*.java android/app/src/main/java/com/m3u/colorida/
      - name: Agregar ExoPlayer (Media3) al APK
        run: |
          sed -i '0,/^dependencies {/s//dependencies {\n    implementation "androidx.media3:media3-exoplayer:1.3.1"\n    implementation "androidx.media3:media3-exoplayer-hls:1.3.1"\n    implementation "androidx.media3:media3-ui:1.3.1"/' android/app/build.gradle
          sed -i 's#</application>#    <activity android:name=".PlayerActivity" android:exported="false" android:supportsPictureInPicture="true" android:resizeableActivity="true" android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode" android:theme="@style/AppTheme.NoActionBar" />\n    </application>#' android/app/src/main/AndroidManifest.xml
          grep -q media3-exoplayer android/app/build.gradle || { echo "No se pudo agregar Media3 a build.gradle"; cat android/app/build.gradle; exit 1; }
          grep -q PlayerActivity android/app/src/main/AndroidManifest.xml || { echo "No se pudo registrar PlayerActivity"; exit 1; }
          grep -q 'AppTheme.NoActionBar"' android/app/src/main/res/values/styles.xml || { echo "Falta el tema AppTheme.NoActionBar"; cat android/app/src/main/res/values/styles.xml; exit 1; }
      - name: Permitir actualizar desde la app (instalador + FileProvider)
        run: |
          mkdir -p android/app/src/main/res/xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<paths>\n    <cache-path name="updates" path="updates/" />\n</paths>\n' > android/app/src/main/res/xml/update_paths.xml
          M=android/app/src/main/AndroidManifest.xml
          grep -q REQUEST_INSTALL_PACKAGES $M || sed -i 's#<application#<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application#' $M
          sed -i 's#</application>#    <provider android:name=".UpdateFileProvider" android:authorities="${applicationId}.updates" android:exported="false" android:grantUriPermissions="true">\n            <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/update_paths" />\n        </provider>\n    </application>#' $M
          grep -q REQUEST_INSTALL_PACKAGES $M || { echo "Falta el permiso de instalación"; cat $M; exit 1; }
          grep -q UpdateFileProvider $M || { echo "No se pudo registrar el proveedor de archivos"; cat $M; exit 1; }
      - name: Modo TV (aparecer en Android TV y Fire TV)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/drawable
          cp android-src/tv_banner.png android/app/src/main/res/drawable/tv_banner.png
          grep -q 'android.software.leanback' $M || sed -i 's#<application#<uses-feature android:name="android.software.leanback" android:required="false" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n    <application#' $M
          grep -q LEANBACK_LAUNCHER $M || sed -i 's#<category android:name="android.intent.category.LAUNCHER" />#<category android:name="android.intent.category.LAUNCHER" />\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />#' $M
          grep -q 'android:banner' $M || sed -i 's#<application#<application android:banner="@drawable/tv_banner"#' $M
          grep -q LEANBACK_LAUNCHER $M || { echo "No se pudo agregar el lanzador de TV"; cat $M; exit 1; }
          grep -q 'android:banner' $M || { echo "No se pudo agregar el banner"; cat $M; exit 1; }
          grep -q 'android.software.leanback' $M || { echo "No se pudo declarar leanback"; cat $M; exit 1; }
      - name: Firma fija y versión creciente (para poder actualizar sin desinstalar)
        run: |
          cp cybertv.keystore android/app/cybertv.keystore
          sed -i '0,/^android {/s//android {\n    signingConfigs {\n        debug {\n            storeFile file("cybertv.keystore")\n            storePassword "cybertv123"\n            keyAlias "cybertv"\n            keyPassword "cybertv123"\n        }\n    }/' android/app/build.gradle
          sed -i "s/versionCode 1\b/versionCode $GITHUB_RUN_NUMBER/; s/versionName \"1.0\"/versionName \"1.$GITHUB_RUN_NUMBER\"/" android/app/build.gradle
          grep -q 'cybertv.keystore' android/app/build.gradle || { echo "No se pudo configurar la firma"; cat android/app/build.gradle; exit 1; }
          grep -q "versionCode $GITHUB_RUN_NUMBER" android/app/build.gradle || { echo "No se pudo fijar versionCode"; cat android/app/build.gradle; exit 1; }
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: M3U-Colorida-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK en Releases (enlace fijo de descarga)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk M3U-Colorida.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest M3U-Colorida.apk --title "Última versión" --notes "APK compilado automáticamente (build $GITHUB_RUN_NUMBER)." --target "$GITHUB_SHA"
