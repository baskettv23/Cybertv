<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DANNYTV</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <nav id="nav"></nav>
    <main id="view"></main>
  </div>

  <div id="player" class="player hidden">
    <div class="player-box">
      <div class="player-top">
        <span id="player-title">—</span>
        <span><span id="zap" class="hidden"><button class="btn yellow small" data-act="zap-prev">▲</button> <span id="zap-n" class="muted"></span> <button class="btn yellow small" data-act="zap-next">▼</button></span>
        <button class="btn yellow small" data-act="player-menu">⚙️ Ajustes</button> <button class="btn red" data-act="close-player">✕ Cerrar</button></span>
      </div>
      <video id="video" controls autoplay playsinline></video>
      <p id="player-msg" class="muted"></p>
    </div>
  </div>

  <div id="info" class="sheet hidden"></div>

  <div id="toast" class="toast hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script src="app.js"></script>
  <script src="features.js"></script>
  <script src="sports.js"></script>
  <script src="platforms.js"></script>
  <script src="watch.js"></script>
  <script src="ratings.js"></script>
  <script src="bg.js"></script>
  <script src="transfer.js"></script>
</body>
</html>
